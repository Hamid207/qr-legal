<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — QR Code Generator - Main</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --rule: #e0e0e3;
    --link: #0a63c9;
    --table-head: #f4f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #e8e8ea;
      --muted: #9a9aa0;
      --rule: #2e2e33;
      --link: #6fb0ff;
      --table-head: #1d1d21;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 2rem 1.15rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 .4rem; letter-spacing: -0.01em; }
  h2 { font-size: 1.22rem; line-height: 1.3; margin: 2.3rem 0 .7rem; letter-spacing: -0.005em; }
  p, ul, ol { margin: 0 0 1rem; }
  ul { padding-left: 1.25rem; }
  li { margin-bottom: .45rem; }
  a { color: var(--link); overflow-wrap: anywhere; }
  strong { font-weight: 600; }
  em { font-style: italic; }
  .updated { color: var(--muted); margin: 0 0 1.6rem; }
  .caps { text-transform: none; }
  .doclink { margin: 2.6rem 0 0; padding-top: 1.2rem; border-top: 1px solid var(--rule); color: var(--muted); }
</style>
</head>
<body>
<main>

<ul>
<li><a href="terms.html">Terms of Use</a></li>
<li><a href="privacy.html">Privacy Policy</a></li>

</ul>

</body>
</html>
